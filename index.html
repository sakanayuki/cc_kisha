<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>おもちゃの汽車</title>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="hint"></div>
    <nav id="toolbar">
      <button id="btn-rail" class="tool active" aria-label="レールモード">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M8 40 C 8 22, 20 14, 40 8" />
          <path d="M16 42 C 16 28, 26 22, 44 17" />
          <path class="tie" d="M10 30 l9 4 M16 22 l8 5 M26 16 l6 5" />
        </svg>
        <span>レール</span>
      </button>
      <button id="btn-go" class="tool" aria-label="発車モード">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <rect x="8" y="22" width="22" height="14" rx="3" />
          <rect x="22" y="12" width="12" height="14" rx="2" />
          <rect x="12" y="15" width="5" height="9" rx="1" />
          <circle cx="14" cy="38" r="4" class="wheel" />
          <circle cx="28" cy="38" r="4" class="wheel" />
          <path d="M34 28 h8 v8 h-8" class="plain" />
        </svg>
        <span>発車</span>
      </button>
      <button id="btn-trash" class="tool" aria-label="ゴミ箱(長押しで全消去)">
        <svg class="ring" viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="29" />
        </svg>
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M12 14 h24 l-2 26 a3 3 0 0 1 -3 3 h-14 a3 3 0 0 1 -3 -3 z" />
          <path d="M9 14 h30 M19 14 v-4 h10 v4" class="plain" />
          <path d="M20 20 v16 M28 20 v16" class="plain" />
        </svg>
        <span>長押しで消去</span>
      </button>
    </nav>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
